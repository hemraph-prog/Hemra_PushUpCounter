<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hemra Push-Up Counter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Fitness tracker</p>
          <h1>Hemra Push-Up Counter</h1>
        </div>
        <button id="startButton" class="primary-button">Start camera</button>
      </header>

      <section class="workspace">
        <div class="camera-panel">
          <div class="camera-frame">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="outputCanvas"></canvas>
          </div>
        </div>

        <aside class="stats-panel">
          <div class="stat-card">
            <span class="label">Total reps</span>
            <strong id="counterValue">0</strong>
          </div>

          <div class="stat-card status-card">
            <span class="label">Pose state</span>
            <strong id="stateLabel">Waiting</strong>
          </div>

          <div class="recommendation">
            <h2>How to use</h2>
            <ul>
              <li>Stand facing the camera so your torso is visible.</li>
              <li>Keep your shoulders and hips in frame.</li>
              <li>Lower until your elbows bend and raise back up.</li>
            </ul>
          </div>
        </aside>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js"></script>
    <script src="app.js"></script>
  </body>
</html>
